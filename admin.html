<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>편집 — 리아의 중간정도 크기의 미술관</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1 class="site-title">편집실 ✏️</h1>
    <p class="tagline">제목/주제/설명을 입력하고 저장하면 갤러리에 바로 반영돼요</p>
    <nav>
      <a href="index.html">갤러리</a>
      <a href="about.html">작가 소개</a>
      <a href="admin.html" class="active">✏️ 편집</a>
    </nav>
  </header>

  <main>
    <datalist id="categorySuggestions">
      <option value="가족"></option>
      <option value="자연"></option>
      <option value="동시"></option>
      <option value="일상"></option>
    </datalist>
    <div class="admin-toolbar">
      <span class="admin-status" id="status"></span>
      <button class="btn btn-primary" id="saveBtn">💾 저장</button>
    </div>
    <div id="serverWarning" class="server-warning" style="display:none">
      ⚠️ 서버가 실행되지 않았어요. <code>start.command</code> 파일을 더블클릭해서 서버를 켠 뒤,
      <a href="http://localhost:8765/admin.html">http://localhost:8765/admin.html</a> 에서 편집해주세요.
    </div>
    <div id="adminList" class="admin-list"></div>
  </main>

  <footer>
    <p>made with <span class="heart">♥</span> for 리아</p>
  </footer>

  <script src="artworks.js"></script>
  <script>
    // === Render edit form (read base values from artworks.js, no localStorage) ===
    const list = document.getElementById('adminList');

    artworks.forEach(art => {
      const item = document.createElement('div');
      item.className = 'admin-item';

      const thumb = document.createElement('div');
      thumb.className = 'admin-thumb';
      const img = document.createElement('img');
      img.src = art.src;
      img.alt = '';
      thumb.appendChild(img);

      const fields = document.createElement('div');
      fields.className = 'admin-fields';
      fields.innerHTML = `
        <label>
          <span>제목</span>
          <input type="text" data-field="title" placeholder="예: 무지개 고양이" />
        </label>
        <label>
          <span>주제</span>
          <input type="text" data-field="category" list="categorySuggestions" placeholder="예: 가족, 자연, 동시, 일상 (비워두면 '기타')" />
        </label>
        <label>
          <span>날짜</span>
          <input type="text" data-field="date" placeholder="예: 2026년 4월" />
        </label>
        <label>
          <span>설명</span>
          <textarea data-field="description" rows="3" placeholder="작품에 대한 이야기를 자유롭게 적어주세요"></textarea>
        </label>
      `;

      fields.querySelector('[data-field="title"]').value = art.title ?? '';
      fields.querySelector('[data-field="category"]').value = art.category ?? '';
      fields.querySelector('[data-field="date"]').value = art.date ?? '';
      fields.querySelector('[data-field="description"]').value = art.description ?? '';

      // Mirror live edits onto the in-memory artwork (so the copy button always sees latest)
      fields.querySelectorAll('[data-field]').forEach(input => {
        input.addEventListener('input', () => {
          art[input.dataset.field] = input.value;
        });
      });

      item.appendChild(thumb);
      item.appendChild(fields);
      list.appendChild(item);
    });

    // === Show warning if not running through server ===
    const usingServer = location.protocol === 'http:' || location.protocol === 'https:';
    if (!usingServer) {
      document.getElementById('serverWarning').style.display = 'block';
    }

    // === Save: POST artworks to server, which writes artworks.js ===
    const status = document.getElementById('status');
    document.getElementById('saveBtn').addEventListener('click', async () => {
      if (!usingServer) {
        alert('먼저 start.command를 실행해서 서버를 켜주세요.');
        return;
      }
      status.textContent = '저장 중...';
      status.className = 'admin-status';
      try {
        const res = await fetch('/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ artworks })
        });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        status.textContent = `✓ 저장됨 (${data.count}개 작품)`;
        status.className = 'admin-status saved';
        setTimeout(() => { status.textContent = ''; }, 4000);
      } catch (e) {
        status.textContent = '✗ 저장 실패: ' + e.message;
        status.className = 'admin-status failed';
      }
    });
  </script>
</body>
</html>
