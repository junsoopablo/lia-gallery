  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<body>
  <header>
    <h1 class="site-title">리아의 중간정도 크기의 미술관&nbsp;<span class="star">★</span></h1>
    <p class="tagline">일곱 살 꼬마 작가 리아의 그림 모음</p>
    <nav>
      <a href="index.html">갤러리</a>
      <a href="about.html">작가 소개</a>
      <a href="guestbook.html" class="active">방명록</a>
      <a href="upload.html">올리기</a>
      <a href="#" class="admin-only" id="logoutLink">로그아웃</a>
      <a href="admin.html" class="admin-link" hidden>✏️ 편집</a>
    </nav>
  </header>

  <main>
    <div class="about-hero">
      <span class="about-emoji" role="img" aria-label="편지">💌</span>
    </div>

    <section class="comments comments-page" data-page="guestbook" aria-label="방명록">
      <h2 class="comments-title">💬 방명록</h2>
      <p class="comments-hint">리아에게 따뜻한 한마디를 남겨주세요. 잘 보고 있어요!</p>
      <form class="comment-form">
        <input type="text" name="name" placeholder="이름" maxlength="50" required autocomplete="name" />
        <textarea name="message" placeholder="메시지를 적어주세요" maxlength="1000" rows="4" required></textarea>
        <div class="comment-form-foot">
          <span class="comment-form-status" aria-live="polite"></span>
          <button type="submit" class="btn btn-primary">남기기</button>
        </div>
      </form>
      <div class="comment-list">
        <p class="comment-loading">댓글 불러오는 중...</p>
      </div>
    </section>
  </main>

  <footer>
    <p>made with <span class="heart">♥</span> for 리아</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    if (['localhost', '127.0.0.1'].includes(location.hostname)) {
      document.querySelectorAll('.admin-link').forEach(a => a.hidden = false);
    }
  </script>
  <script src="comments.js" defer></script>
