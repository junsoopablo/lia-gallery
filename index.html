<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>리아의 중간정도 크기의 미술관</title>
  <meta name="description" content="일곱 살 꼬마 작가 리아의 그림 모음" />

  <!-- Open Graph (카카오톡, 페이스북, 슬랙 등 공유 미리보기) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="리아의 중간정도 크기의 미술관" />
  <meta property="og:title" content="리아의 중간정도 크기의 미술관" />
  <meta property="og:description" content="일곱 살 꼬마 작가 리아의 그림 모음 — 가족·자연·동시·일상" />
  <meta property="og:url" content="https://junsoopablo.github.io/lia-gallery/" />
  <meta property="og:image" content="https://junsoopablo.github.io/lia-gallery/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="ko_KR" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="리아의 중간정도 크기의 미술관" />
  <meta name="twitter:description" content="일곱 살 꼬마 작가 리아의 그림 모음" />
  <meta name="twitter:image" content="https://junsoopablo.github.io/lia-gallery/og-image.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1 class="site-title">리아의 중간정도 크기의 미술관&nbsp;<span class="star">★</span></h1>
    <p class="tagline">일곱 살 꼬마 작가 리아의 그림 모음</p>
    <nav>
      <a href="index.html" class="active">갤러리</a>
      <a href="about.html">작가 소개</a>
      <a href="guestbook.html">방명록</a>
      <a href="upload.html">올리기</a>
      <a href="#" class="admin-only" id="logoutLink">로그아웃</a>
      <a href="admin.html" class="admin-link" hidden>✏️ 편집</a>
    </nav>
  </header>

  <main>
    <div id="filterBar" class="filter-bar" role="tablist" aria-label="주제별 필터"></div>
    <section id="gallery" class="gallery" aria-label="작품 목록"></section>

  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="작품 크게 보기">
    <button class="lightbox-close" id="lightboxClose" aria-label="닫기">✕</button>
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="이전 작품">‹</button>
    <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="다음 작품">›</button>
    <div class="lightbox-content">
      <img id="lightboxImg" src="" alt="" />
      <div class="lightbox-info">
        <h2 class="artwork-title" id="lightboxTitle"></h2>
        <p class="artwork-meta" id="lightboxMeta"></p>
        <p class="artwork-desc" id="lightboxDesc"></p>
        <div class="lightbox-likes">
          <button class="lightbox-like-btn" id="lightboxLikeBtn" type="button">
            <span class="like-icon">🤍</span>
            <span class="like-count">0</span>
            <span class="like-label">좋아요</span>
          </button>
          <div class="lightbox-likers" id="lightboxLikers"></div>
        </div>
        <button class="lightbox-delete admin-only" id="lightboxDelete" type="button">🗑️ 삭제</button>
      </div>
    </div>
  </div>

  <!-- Name modal (likes 처음 누를 때) -->
  <div class="name-modal" id="nameModal" hidden role="dialog" aria-modal="true" aria-label="이름 입력">
    <div class="name-modal-content">
      <h3>이름을 알려주세요</h3>
      <p>좋아요 누르려면 이름이 필요해요. 한 번만 적으면 돼요.</p>
      <input type="text" id="nameModalInput" maxlength="50" placeholder="예: 김ㅇㅇ" />
      <div class="name-modal-buttons">
        <button type="button" id="nameModalCancel" class="btn btn-ghost">취소</button>
        <button type="button" id="nameModalOk" class="btn btn-primary">확인</button>
      </div>
    </div>
  </div>

  <footer>
    <p>made with <span class="heart">♥</span> for 리아</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    // === Show 편집 link only on localhost ===
    if (['localhost', '127.0.0.1'].includes(location.hostname)) {
      document.querySelectorAll('.admin-link').forEach(a => a.hidden = false);
    }

    // === Helper: normalize category ===
    function getCat(art) {
      const c = (art.category || '').trim();
      return c || '기타';
    }

    let artworks = [];
    let currentUser = null;
    const gallery = document.getElementById('gallery');
    const filterBar = document.getElementById('filterBar');

    // 현재 사용자 상태 추적
    sb.auth.getSession().then(({ data: { session } }) => { currentUser = session?.user || null; });
    sb.auth.onAuthStateChange((_e, session) => {
      currentUser = session?.user || null;
      // 라이트박스가 열려있으면 좋아요 상태 갱신
      if (lightbox.classList.contains('open') && artworks[currentIdx]) {
        updateLightboxLikes(artworks[currentIdx]);
      }
    });

    // === Load artworks (with likes) ===
    async function loadArtworks() {
      gallery.innerHTML = '<div class="empty">작품 불러오는 중...</div>';
      const url = `${SUPABASE_URL}/rest/v1/artworks?select=*,likes(user_id,display_name)&order=sort_order.desc.nullslast,created_at.desc`;
      try {
        const res = await fetch(url, {
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
          }
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const rows = await res.json();
        artworks = rows.map(r => ({
          id: r.id,
          title: r.title || '',
          date: r.date || '',
          category: r.category || '',
          description: r.description || '',
          src: imageUrl(r.image_path),
          likes: r.likes || [],
        }));
        renderGallery();
      } catch (e) {
        gallery.innerHTML = '<div class="empty">작품을 불러오지 못했어요: ' + e.message + '</div>';
      }
    }

    // === Render gallery ===
    function renderGallery() {
      gallery.innerHTML = '';
      filterBar.innerHTML = '';

      if (!artworks.length) {
        gallery.innerHTML = '<div class="empty">곧 새 작품이 올라올 거예요!</div>';
        return;
      }

      artworks.forEach((art, idx) => {
        const card = document.createElement('article');
        card.className = 'artwork-card';
        card.dataset.idx = idx;
        card.dataset.id = art.id;
        card.dataset.category = getCat(art);

        const wrap = document.createElement('div');
        wrap.className = 'artwork-img-wrap';
        const img = document.createElement('img');
        img.src = art.src;
        img.alt = art.title;
        img.loading = 'lazy';
        wrap.appendChild(img);

        const info = document.createElement('div');
        info.className = 'artwork-info';
        const h3 = document.createElement('h3');
        h3.className = 'artwork-title';
        h3.textContent = art.title;
        const meta = document.createElement('p');
        meta.className = 'artwork-meta';
        const dateText = document.createElement('span');
        dateText.textContent = art.date || '';
        meta.appendChild(dateText);
        if (art.likes && art.likes.length > 0) {
          const pill = document.createElement('span');
          pill.className = 'card-like-pill';
          pill.textContent = ` · ❤️ ${art.likes.length}`;
          meta.appendChild(pill);
        }
        info.appendChild(h3);
        info.appendChild(meta);
        if (art.description) {
          const desc = document.createElement('p');
          desc.className = 'artwork-desc';
          desc.textContent = art.description;
          info.appendChild(desc);
        }

        card.appendChild(wrap);
        card.appendChild(info);
        card.addEventListener('click', () => openLightbox(idx));
        gallery.appendChild(card);
      });

      // === Build filter buttons ===
      const counts = new Map();
      artworks.forEach(a => {
        const c = getCat(a);
        counts.set(c, (counts.get(c) || 0) + 1);
      });
      // Order: named categories (alpha) first, 기타 last
      const named = Array.from(counts.keys()).filter(c => c !== '기타').sort((a, b) => a.localeCompare(b, 'ko'));
      const orderedCats = [...named];
      if (counts.has('기타')) orderedCats.push('기타');

      // Only show filter bar if there's at least one named category
      if (named.length > 0) {
        addFilterBtn('전체', artworks.length, true);
        orderedCats.forEach(cat => addFilterBtn(cat, counts.get(cat), false));
      }
    }

    let currentFilter = '전체';

    loadArtworks();

    function addFilterBtn(label, count, active) {
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (active ? ' active' : '');
      btn.dataset.cat = label;
      btn.innerHTML = `${label} <span class="filter-count">${count}</span>`;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = label;
        applyFilter();
      });
      filterBar.appendChild(btn);
    }

    function applyFilter() {
      document.querySelectorAll('.artwork-card').forEach(card => {
        const visible = currentFilter === '전체' || card.dataset.category === currentFilter;
        card.classList.toggle('hidden', !visible);
      });
    }

    // === Lightbox ===
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightboxImg');
    const lbTitle = document.getElementById('lightboxTitle');
    const lbMeta = document.getElementById('lightboxMeta');
    const lbDesc = document.getElementById('lightboxDesc');
    let currentIdx = 0;

    function openLightbox(idx) {
      currentIdx = idx;
      const art = artworks[idx];
      lbImg.src = art.src;
      lbImg.alt = art.title;
      lbTitle.textContent = art.title;
      lbMeta.textContent = art.date || '';
      lbDesc.textContent = art.description || '';
      updateLightboxLikes(art);
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function updateLightboxLikes(art) {
      const btn = document.getElementById('lightboxLikeBtn');
      const icon = btn.querySelector('.like-icon');
      const countEl = btn.querySelector('.like-count');
      const likers = document.getElementById('lightboxLikers');
      const likes = art.likes || [];
      const liked = currentUser && likes.some(l => l.user_id === currentUser.id);
      icon.textContent = liked ? '❤️' : '🤍';
      btn.classList.toggle('liked', !!liked);
      countEl.textContent = likes.length;
      likers.textContent = likes.length ? likes.map(l => l.display_name).join(', ') : '';
    }

    function refreshCardLikes(art) {
      const card = document.querySelector(`.artwork-card[data-id="${art.id}"]`);
      if (!card) return;
      const meta = card.querySelector('.artwork-meta');
      if (!meta) return;
      // Re-render meta line
      meta.innerHTML = '';
      const dateText = document.createElement('span');
      dateText.textContent = art.date || '';
      meta.appendChild(dateText);
      if (art.likes && art.likes.length > 0) {
        const pill = document.createElement('span');
        pill.className = 'card-like-pill';
        pill.textContent = ` · ❤️ ${art.likes.length}`;
        meta.appendChild(pill);
      }
    }

    // === Name modal ===
    function promptForName() {
      return new Promise((resolve) => {
        const modal = document.getElementById('nameModal');
        const input = document.getElementById('nameModalInput');
        const ok = document.getElementById('nameModalOk');
        const cancel = document.getElementById('nameModalCancel');

        function close(name) {
          modal.hidden = true;
          input.value = '';
          ok.onclick = cancel.onclick = input.onkeydown = null;
          resolve(name);
        }
        ok.onclick = () => {
          const name = input.value.trim();
          if (!name) { input.focus(); return; }
          close(name);
        };
        cancel.onclick = () => close(null);
        input.onkeydown = (e) => {
          if (e.key === 'Enter') ok.onclick();
          else if (e.key === 'Escape') cancel.onclick();
        };

        modal.hidden = false;
        setTimeout(() => input.focus(), 50);
      });
    }

    const NAME_KEY = 'lia-gallery-display-name';

    async function ensureUser() {
      const { data: { session } } = await sb.auth.getSession();
      if (session) { currentUser = session.user; return session.user; }

      const name = await promptForName();
      if (!name) return null;

      // 이름을 localStorage에 즉시 저장 (updateUser 실패해도 fallback)
      localStorage.setItem(NAME_KEY, name);

      const { data: signupData, error: signupErr } = await sb.auth.signInAnonymously();
      if (signupErr) {
        console.error('signInAnonymously error:', signupErr);
        alert('인증 실패: ' + signupErr.message);
        return null;
      }
      currentUser = signupData.user;

      // user_metadata 업데이트는 best-effort (실패해도 좋아요는 진행)
      sb.auth.updateUser({ data: { display_name: name } })
        .then(({ error }) => { if (error) console.warn('updateUser error:', error); })
        .catch(e => console.warn('updateUser exception:', e));

      return signupData.user;
    }

    function displayNameOf(user) {
      const meta = user && user.user_metadata && user.user_metadata.display_name;
      if (meta) return meta;
      const stored = localStorage.getItem(NAME_KEY);
      if (stored) return stored;
      if (user && user.email === 'liakim@junsoopablo.local') return '리아';
      if (user && user.email) return user.email.split('@')[0];
      return '익명';
    }

    // === Like toggle ===
    document.getElementById('lightboxLikeBtn').addEventListener('click', async (e) => {
      e.stopPropagation();
      e.preventDefault();
      const art = artworks[currentIdx];
      if (!art) { console.warn('no current artwork'); return; }
      console.log('[like] click on', art.title, 'id=', art.id);

      const user = await ensureUser();
      if (!user) { console.log('[like] no user'); return; }
      console.log('[like] user id=', user.id, 'is_anonymous=', user.is_anonymous);

      const myLike = (art.likes || []).find(l => l.user_id === user.id);
      if (myLike) {
        // 취소 (optimistic)
        art.likes = art.likes.filter(l => l !== myLike);
        updateLightboxLikes(art); refreshCardLikes(art);
        const { error } = await sb.from('likes').delete()
          .eq('artwork_id', art.id).eq('user_id', user.id);
        if (error) {
          console.error('[like] delete error:', error);
          art.likes.push(myLike);
          updateLightboxLikes(art); refreshCardLikes(art);
          alert('좋아요 취소 실패: ' + error.message);
        } else {
          console.log('[like] removed');
        }
      } else {
        // 추가 (optimistic)
        const name = displayNameOf(user);
        const newLike = { user_id: user.id, display_name: name };
        art.likes = [...(art.likes || []), newLike];
        updateLightboxLikes(art); refreshCardLikes(art);
        console.log('[like] inserting:', { artwork_id: art.id, user_id: user.id, display_name: name });
        const { data, error } = await sb.from('likes').insert({
          artwork_id: art.id, user_id: user.id, display_name: name,
        }).select();
        if (error) {
          console.error('[like] insert error:', error);
          art.likes = art.likes.filter(l => l !== newLike);
          updateLightboxLikes(art); refreshCardLikes(art);
          alert('좋아요 실패: ' + error.message + '\n(자세한 내용은 콘솔 확인)');
        } else {
          console.log('[like] inserted:', data);
        }
      }
    });

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    function nav(delta) {
      // Walk through currently visible cards only (respects active filter)
      const visibleCards = Array.from(document.querySelectorAll('.artwork-card:not(.hidden)'));
      if (!visibleCards.length) return;
      const visibleIdxs = visibleCards.map(c => parseInt(c.dataset.idx, 10));
      const pos = visibleIdxs.indexOf(currentIdx);
      const newPos = (pos + delta + visibleIdxs.length) % visibleIdxs.length;
      openLightbox(visibleIdxs[newPos]);
    }

    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    document.getElementById('lightboxPrev').addEventListener('click', e => { e.stopPropagation(); nav(-1); });
    document.getElementById('lightboxNext').addEventListener('click', e => { e.stopPropagation(); nav(1); });

    document.getElementById('lightboxDelete').addEventListener('click', async (e) => {
      e.stopPropagation();
      const art = artworks[currentIdx];
      if (!art) return;
      const label = art.title || '이 작품';
      if (!confirm(`"${label}"을(를) 정말 삭제할까요?\n되돌릴 수 없어요.`)) return;

      const filename = (art.src || '').split('/').pop();
      try {
        const { error: rowErr } = await sb.from('artworks').delete().eq('id', art.id);
        if (rowErr) throw rowErr;
        // 이미지 파일도 삭제 (실패해도 행은 이미 지워짐)
        if (filename) await sb.storage.from('artworks').remove([filename]);
        closeLightbox();
        await loadArtworks();
      } catch (err) {
        alert('삭제 실패: ' + (err.message || err));
      }
    });
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') nav(-1);
      else if (e.key === 'ArrowRight') nav(1);
    });

    // === Touch swipe support (mobile) ===
    let touchStartX = 0, touchStartY = 0;
    lightbox.addEventListener('touchstart', e => {
      const t = e.changedTouches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
    }, { passive: true });
    lightbox.addEventListener('touchend', e => {
      if (!lightbox.classList.contains('open')) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;
      // 가로 스와이프 (수직보다 더 크고 50px 이상)
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        nav(dx < 0 ? 1 : -1);
      }
    }, { passive: true });
  </script>
</body>
</html>
